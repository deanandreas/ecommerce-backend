version: "2"
sql:
  - schema: "internal/database/migrations"
    queries: "internal/database/queries"
    engine: "postgresql"
    gen:
      go:
        emit_json_tags: true
        package: "db"
        out: "internal/database/sqlc"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "string"
          - column: "users.hash_password"
            go_struct_tag: 'json:"-"'
          - column: "products.user_id"
            go_struct_tag: 'json:"-"'
